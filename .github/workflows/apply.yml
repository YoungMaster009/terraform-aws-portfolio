name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "environments/dev/**"
      - "modules/**"
      - "user-data.sh"
      - "spacevideo.mp4"
  workflow_dispatch:
    inputs:
      action:
        description: "apply or destroy dev"
        type: choice
        options: [apply, destroy]
        default: apply
  schedule:
    - cron: "0 6 * * *"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::590183753633:role/github-actions-terraform
          aws-region: us-west-1

      - name: init
        run: terraform init -input=false

      - name: apply
        if: github.event_name == 'push' || inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false

      - name: destroy
        if: github.event_name == 'schedule' || inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false