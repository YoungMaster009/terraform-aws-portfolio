name: terraform

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write        # OIDC: assume AWS roles without stored keys
  contents: read
  pull-requests: write   # post the AI plan review as a PR comment

jobs:
  plan:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false   # the wrapper adds extra lines to stdout, which corrupts plan JSON

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::590183753633:role/github-actions-terraform
          aws-region: us-west-1

      - name: fmt
        run: terraform fmt -check -recursive
        working-directory: .

      - name: init
        run: terraform init -input=false

      - name: validate
        run: terraform validate

      - name: plan
        run: terraform plan -input=false -out=tfplan

      - name: plan as JSON
        run: terraform show -json tfplan > plan.json   # stays on the runner; it can contain secrets

      # ---------- AI plan review (bedrock-terraform-reviewer) ----------

      - name: check out the reviewer
        uses: actions/checkout@v7
        with:
          repository: YoungMaster009/bedrock-terraform-reviewer
          path: reviewer
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: install the reviewer
        run: pip install -r reviewer/requirements.txt
        working-directory: .

      - name: switch to the plan-reviewer role (Nova Lite only)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::590183753633:role/github-actions-plan-reviewer
          aws-region: us-west-1

      - name: review the plan
        id: review
        run: |
          set +e
          python ../../reviewer/review.py plan.json --out comment.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: post or update the review comment
        if: always() && hashFiles('environments/dev/comment.md') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- bedrock-plan-review -->';
            const body = marker + '\n' + fs.readFileSync('environments/dev/comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: prove the reviewer role is least privilege
        if: always()
        run: python reviewer/security/prove_least_privilege.py
        working-directory: .

      - name: enforce the rules verdict
        run: exit ${{ steps.review.outputs.exit_code }}
